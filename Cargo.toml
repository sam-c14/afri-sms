[workspace]
resolver = "2"
members = [
    "crates/afri-sms",
    "crates/afri-sms-skills",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Samuel Affah"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sam-c14/afri-sms"
homepage = "https://github.com/sam-c14/afri-sms"
keywords = ["sms", "africa", "fintech", "otp", "telecom"]
categories = ["web-programming::http-client", "api-bindings"]

[workspace.dependencies]
afri-sms = { path = "crates/afri-sms", version = "0.1.0" }
async-trait = "0.1.92"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
