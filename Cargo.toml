[package]
name = "afri-sms"
version = "0.1.0"
edition = "2024"
authors = ["Samuel Affah"]
description = "A unified, highly-optimized SMS/OTP adapter crate for African telecom providers with automated fallback routing."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sms", "africa", "fintech", "otp", "telecom"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
